name: Release

# Cut a release by pushing a version tag: git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Assemble the binary archive
        id: archive
        run: |
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          version="${tag#v}"
          stage="hyprwake-${version}-x86_64-linux"
          mkdir -p "$stage"
          install -m755 target/release/hyprwake "$stage/"
          install -m644 README.md LICENSE CHANGELOG.md "$stage/"
          strip "$stage/hyprwake" || true
          tar czf "${stage}.tar.gz" "$stage"
          sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "archive=${stage}.tar.gz"
          } >> "$GITHUB_OUTPUT"

      # The Omarchy Package Repository builds from the GitHub source tarball,
      # so its checksum is what a package submission needs. Producing it here
      # means the PKGBUILD never has to be checksummed by hand.
      - name: Prepare the OPR package files
        id: opr
        run: |
          tag="${{ steps.archive.outputs.tag }}"
          version="${{ steps.archive.outputs.version }}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
          curl -fsSL "$url" -o source.tar.gz
          sha256=$(sha256sum source.tar.gz | cut -d' ' -f1)

          mkdir -p opr/hyprwake/.omarchy
          sed -e "s/^pkgver=.*/pkgver=${version}/" \
              -e "s/^pkgrel=.*/pkgrel=1/" \
              -e "s/^sha256sums=.*/sha256sums=('${sha256}')/" \
              PKGBUILD > opr/hyprwake/PKGBUILD
          cp packaging/opr/package.json opr/hyprwake/.omarchy/package.json
          tar czf opr-hyprwake-${version}.tar.gz -C opr hyprwake

          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "archive=opr-hyprwake-${version}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          cat > notes.md <<EOF
          ## Install

          \`\`\`sh
          cargo install --git https://github.com/${GITHUB_REPOSITORY} --tag ${{ steps.archive.outputs.tag }}
          \`\`\`

          Or take the prebuilt \`${{ steps.archive.outputs.archive }}\` below and put
          \`hyprwake\` on your PATH. Then:

          \`\`\`sh
          hyprwake install   # wire it into the desktop
          hyprwake save      # give it something to restore
          \`\`\`

          ## Packaging

          Source tarball SHA-256, for a PKGBUILD:

          \`\`\`
          ${{ steps.opr.outputs.sha256 }}
          \`\`\`

          \`${{ steps.opr.outputs.archive }}\` contains the package directory ready
          to drop into a pull request against
          [omacom/omarchy-pkgs](https://github.com/omacom/omarchy-pkgs) under
          \`pkgbuilds/\`.
          EOF
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
            ${{ steps.opr.outputs.archive }}
