[package]
name = "hyprflow"
version = "0.2.0"
edition = "2021"
description = "Save and restore Hyprland window sessions"
license = "MIT"
repository = "https://github.com/iSorensen/hyprflow"
readme = "README.md"
keywords = ["hyprland", "wayland", "session", "restore"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
which = "8.0"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
