[package]
name = "hyprwake"
version = "0.1.3"
edition = "2021"
description = "Save and restore Hyprland sessions: windows, workspaces, terminal directories and TUIs"
license = "MIT"
repository = "https://github.com/rumen-cholakov/hyprwake"
readme = "README.md"
keywords = ["hyprland", "wayland", "session", "restore"]
categories = ["command-line-utilities"]

[features]
# Exposes the hyprctl/process test doubles to integration tests.
testing = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
which = "8.0"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
